name: AMAN CI

permissions:
  contents: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Lint, Production Build, and Security Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Refresh lockfile for biometric dependency recovery
        run: npm install --package-lock-only

      - name: Install dependencies cleanly
        run: npm ci

      - name: Upload refreshed package lock
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-package-lock
          path: package-lock.json
          if-no-files-found: error

      - name: Commit synchronized package lock to recovery branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: synchronize npm lockfile for WebAuthn"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Typecheck
        run: npm run lint

      - name: Run automated security and crypto tests
        run: npm test

      - name: Build production frontend and server bundle
        env:
          VITE_APP_MODE: production
        run: |
          npm run build
          test -f dist/index.html
          test -f dist-server/index.mjs
